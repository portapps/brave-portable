name: released

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  release:
    types: [published]

jobs:
  virustotal:
    uses: portapps/.github/.github/workflows/app-virustotal.yml@e5160763f75f635b71a10d8162c004e7f88a1a87 # v1.4.1
    permissions:
      contents: write # required to write GitHub Release body
    secrets:
      vt_api_key: ${{ secrets.VT_API_KEY }}
      vt_monitor_api_key: ${{ secrets.VT_MONITOR_API_KEY }}
